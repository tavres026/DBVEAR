<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Livro</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <header>

        <div class="container">

            <h1>📚 Biblioteca Digital</h1>

            <nav>

                <a href="{{ url_for('inicio') }}">
                    Início
                </a>

                <a href="{{ url_for('cadastro') }}">
                    Cadastrar Livro
                </a>

                <a href="{{ url_for('acervo') }}">
                    Consultar Acervo
                </a>

            </nav>

        </div>

    </header>


    <main class="container">

        <section class="formulario">

            <h2>Cadastrar Livro</h2>

            <form method="POST">

                <label for="titulo">
                    Título do livro:
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    required
                >


                <label for="isbn">
                    ISBN:
                </label>

                <input
                    type="text"
                    id="isbn"
                    name="isbn"
                >


                <label for="ano">
                    Ano de publicação:
                </label>

                <input
                    type="number"
                    id="ano"
                    name="ano"
                >


                <label for="autor_id">
                    Autor:
                </label>

                <select
                    id="autor_id"
                    name="autor_id"
                    required
                >

                    <option value="">
                        Selecione um autor
                    </option>

                    {% for autor in autores %}

                    <option value="{{ autor.id }}">
                        {{ autor.nome }}
                    </option>

                    {% endfor %}

                </select>


                <label for="categoria_id">
                    Categoria:
                </label>

                <select
                    id="categoria_id"
                    name="categoria_id"
                    required
                >

                    <option value="">
                        Selecione uma categoria
                    </option>

                    {% for categoria in categorias %}

                    <option value="{{ categoria.id }}">
                        {{ categoria.nome }}
                    </option>

                    {% endfor %}

                </select>


                <button type="submit">
                    Cadastrar Livro
                </button>

            </form>

        </section>

    </main>


    <footer>

        <p>
            Sistema de Gerenciamento de Biblioteca
        </p>

    </footer>

</body>

</html>
